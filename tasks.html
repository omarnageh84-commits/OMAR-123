<script>
const THEMES = [
  {id:'amber', name:'عنبر دافئ 🌅', hero:'#D97706', bg:'#FDF6E3', bgSoft:'#FFF7ED', card:'#FFFFFF', border:'#F5E6C8', text:'#1C1917', soft:'#A16207'},
  {id:'dark', name:'ليلي 🌙', hero:'#111111', bg:'#121212', bgSoft:'#1E1E1E', card:'#1A1A1A', border:'#2A2A2A', text:'#FFFFFF', soft:'#888888'},
  {id:'pharmacy', name:'صيدلية 💊', hero:'#0EA5E9', bg:'#F0F9FF', bgSoft:'#E0F2FE', card:'#FFFFFF', border:'#BAE6FD', text:'#0C4A6E', soft:'#0284C7'},
  {id:'forest', name:'غابة 🌿', hero:'#16A34A', bg:'#F0FDF4', bgSoft:'#DCFCE7', card:'#FFFFFF', border:'#BBF7D0', text:'#14532D', soft:'#15803D'},
  {id:'rose', name:'وردي 🌸', hero:'#E11D48', bg:'#FFF1F2', bgSoft:'#FFE4E6', card:'#FFFFFF', border:'#FECDD3', text:'#881337', soft:'#BE123C'},
];
function applyTheme(t){
  const r=document.documentElement;
  r.style.setProperty('--hero', t.hero);
  r.style.setProperty('--bg', t.bg);
  r.style.setProperty('--bg-soft', t.bgSoft);
  r.style.setProperty('--card', t.card);
  r.style.setProperty('--card-border', t.border);
  r.style.setProperty('--text', t.text);
  r.style.setProperty('--text-soft', t.soft);
  r.style.setProperty('--primary', t.hero);
  localStorage.setItem('selectedTheme', t.id);
  document.body.style.background = t.bg;
}
function renderThemesList(){
  const box=document.getElementById('themesList');
  if(!box) return;
  const curId=localStorage.getItem('selectedTheme')||'amber';
  box.innerHTML=THEMES.map(t=>`
    <div onclick="applyThemeById('${t.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;border:2px solid ${t.id===curId?'var(--hero)':'var(--card-border)'};background:${t.bg};cursor:pointer;margin-bottom:6px">
      <div style="display:flex;gap:8px;align-items:center"><div style="width:22px;height:22px;border-radius:6px;background:${t.hero};border:1px solid #0002"></div><span style="font-size:11px;font-weight:800;color:${t.text}">${t.name}</span></div>
      <span style="font-size:12px;font-weight:900">${t.id===curId?'✓':''}</span>
    </div>
  `).join('');
}
function applyThemeById(id){
  const t=THEMES.find(x=>x.id===id);
  if(t){ applyTheme(t); renderThemesList(); }
}
(function(){
  const saved=localStorage.getItem('selectedTheme')||'amber';
  const t=THEMES.find(x=>x.id===saved);
  if(t) applyTheme(t);
})();
</script>

<script src="themes.js"></script>
<style>
:root{--hero:#D97706;--bg:#FDF6E3;--bg-soft:#FFF7ED;--card:#FFFFFF;--card-border:#F5E6C8;--text:#1C1917;--text-soft:#A16207;--primary:#D97706}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:var(--bg);height:100dvh;overflow:hidden;display:flex;flex-direction:column;transition:.3s}
#app{flex:1;display:flex;flex-direction:column;background:var(--card);overflow:hidden;max-width:600px;margin:0 auto;width:100%;border-left:1px solid var(--card-border);border-right:1px solid var(--card-border)}

.tab.active{background:var(--hero);color:#fff;font-weight:800;box-shadow:0 2px 8px color-mix(in srgb, var(--hero) 35%, transparent)}
#cameraVideo{width:100%;border-radius:10px;background:#000;aspect-ratio:3/4;object-fit:cover}

.filter-chip{padding:6px 9px;border-radius:99px;border:1px solid var(--card-border);background:var(--card);font-size:9.8px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--text-soft)}
.filter-chip.active{background:var(--hero);color:#fff;border-color:var(--hero)}
#deleteWarningModal,#secretCodeModal,#gmailModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:11000;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(8px)}

.rich-toolbar{display:flex;gap:5px;padding:7px;background:var(--bg-soft);border-radius:9px;margin-bottom:7px;overflow:auto;align-items:center;flex-shrink:0;direction:rtl}
.rich-toolbar button{border:1px solid var(--card-border);background:var(--card);padding:6px 10px;border-radius:7px;font-weight:800;flex-shrink:0;cursor:pointer;color:var(--text);font-size:11.5px;min-width:32px}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--card);box-shadow:0 0 0 1px #ccc;cursor:pointer;flex-shrink:0}
.rich-editor{flex:1;min-height:30vh;border:1px solid var(--card-border);border-radius:9px;padding:11px;outline:none;background:var(--card);line-height:1.8;overflow:auto;direction:rtl;text-align:right;white-space:pre-wrap;word-break:break-word;color:var(--text);font-size:12.6px}
.rich-editor ul,.rich-editor ol{list-style-position:inside;padding:0;padding-right:20px;margin:9px 0;direction:rtl;text-align:right}
#board{flex:1;overflow:auto;padding:7px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
.gmail-connected{background:#E8F5E9!important;color:#2E7D32!important;border-color:#A5D6A7!important}
</style>
</head>

<script>
/* ===== GMAIL INTEGRATION ===== */
const GMAIL_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
const GMAIL_SCOPES = 'https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send';
let tokenClient, gapiInited=false, gisInited=false, gmailAccessToken=null;
window.addEventListener('load', ()=>{
  gapi.load('client', async () => {
    await gapi.client.init({});
    await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/gmail/v1/rest');
    gapiInited=true;
    const saved = localStorage.getItem('gmail_token');
    if(saved){ gmailAccessToken=saved; document.getElementById('gmailBtn').innerText='✓ مربوط'; document.getElementById('gmailBtn').classList.add('gmail-connected'); document.getElementById('gmailStatus').style.display='block'; }
  });
  setTimeout(()=>{
    if(window.google && window.google.accounts){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GMAIL_CLIENT_ID,
        scope: GMAIL_SCOPES,
        callback: (resp) => {
          if(resp.access_token){
            gmailAccessToken = resp.access_token;
            localStorage.setItem('gmail_token', resp.access_token);
            document.getElementById('gmailBtn').innerText='✓ مربوط';
            document.getElementById('gmailBtn').classList.add('gmail-connected');
            document.getElementById('gmailStatus').style.display='block';
            fetchGmailEmails();
          }
        }
      });
      gisInited=true;
    }
  },1500);
});
function handleGmailAuth(){
  if(GMAIL_CLIENT_ID.includes('YOUR_GOOGLE')){ alert('حط الـ Client ID من console.cloud.google.com\\nفي أول السكربت'); return; }
  if(!gisInited){ alert('جاري تحميل جوجل...'); return; }
  if(gmailAccessToken){ openGmailImport(); return; }
  tokenClient.requestAccessToken({prompt:'consent'});
}
function openGmailImport(){ document.getElementById('gmailModal').classList.add('show'); if(gmailAccessToken) fetchGmailEmails(); }
function closeGmailImport(){ document.getElementById('gmailModal').classList.remove('show'); }
async function fetchGmailEmails(){
  if(!gmailAccessToken){ document.getElementById('gmailList').innerHTML='<div style="text-align:center;padding:20px;color:var(--text-soft)">مش مربوط بجيميل</div>'; return; }
  document.getElementById('gmailList').innerHTML='<div style="text-align:center;padding:20px">⏳ بيحمل...</div>';
  try{
    const res = await gapi.client.gmail.users.messages.list({userId:'me', maxResults:12, q:'newer_than:7d'});
    const msgs = res.result.messages || [];
    if(!msgs.length){ document.getElementById('gmailList').innerHTML='<div style="text-align:center;padding:20px;color:var(--text-soft)">مفيش إيميلات جديدة</div>'; return; }
    let html='';
    for(let m of msgs){
      const detail = await gapi.client.gmail.users.messages.get({userId:'me', id:m.id, format:'metadata', metadataHeaders:['Subject','From']});
      const headers = detail.result.payload.headers;
      const subj = (headers.find(h=>h.name==='Subject')?.value || '(بدون عنوان)').replace(/'/g,'');
      const from = (headers.find(h=>h.name==='From')?.value || '').replace(/'/g,'');
      html+=`<div style="background:var(--bg-soft);border:1px solid var(--card-border);border-radius:10px;padding:9px"><div style="font-weight:700;font-size:11px;color:var(--text)">${subj}</div><div style="font-size:9.5px;color:var(--text-soft)">${from}</div><button onclick="addEmailAsTask('${subj}','${from}')" style="margin-top:7px;background:var(--hero);color:#fff;border:none;padding:5px 10px;border-radius:7px;font-size:10px">+ حول لمهمة</button></div>`;
    }
    document.getElementById('gmailList').innerHTML=html;
  }catch(e){ console.error(e); document.getElementById('gmailList').innerHTML='<div style="color:#ef4444;text-align:center;font-size:11px">خطأ - سجل دخول تاني<br>'+e.message+'</div>'; localStorage.removeItem('gmail_token'); gmailAccessToken=null; }
}
function addEmailAsTask(subj, from){
  tasks.unshift({id:Date.now(), text:subj, cat:cats[0]?.name||'شغل', color:selectedHex||'#ffffff', done:false, drawings:[], photos:[], voices:[], note:`<div>📧 من: ${from}<br>${subj}</div>`, subtasks:[], reminder:null, source:'gmail'});
  save(); alert('✅ اتضافت كمهمة'); closeGmailImport();
}
async function exportTasksToGmail(){
  if(!gmailAccessToken){ alert('اربط جيميل الأول'); return; }
  const summary = tasks.slice(0,25).map(t=>`• [${t.done?'✓':' '}] ${t.text} (${t.cat})`).join('\\n');
  const emailContent = `To: me\\r\\nSubject: ملخص مهامي - مساحة العمل\\r\\nContent-Type: text/plain; charset=utf-8\\r\\n\\r\\n${summary}`;
  const raw = btoa(unescape(encodeURIComponent(emailContent))).replace(/\\+/g,'-').replace(/\\//g,'_').replace(/=+$/, '');
  try{
    await gapi.client.gmail.users.messages.send({userId:'me', resource:{raw}});
    alert('📧 اتبعت ملخص مهامك لإيميلك');
  }catch(e){ alert('فشل الإرسال'); console.error(e); }
}
</script>

const standardColors=["#7030A0","#002060","#0070C0","#00B0F0","#00B050","#92D050","#FFFF00","#FFC000","#FF0000","#C00000"];

let cats=JSON.parse(localStorage.getItem('cats_v5')||JSON.stringify(defaultCats));
let tasks=loadOldTasks();
if(tasks.length===0){tasks=[{id:Date.now(),text:'طلبية صيدلية',cat:'صيدلية',color:'#E2EFDA',done:false,drawings:[],photos:[],voices:[],note:'',subtasks:[],reminder:null}];}
let cur=null,rec=null,chunks=[],timerInt=null,sec=0,stream=null,cameraStream=null;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let drawing=false,lx=0,ly=0,selectedHex='#ffffff',activeTaskTab='all',boardSearch='',currentNoteColor='#111111',currentHiddenColor='#ffffff',currentFontSize=12,currentHiddenFontSize=12;
let lastNoteRange=null,lastHiddenRange=null;
function save(){localStorage.setItem('tasks_v6',JSON.stringify(tasks));localStorage.setItem('cats_v5',JSON.stringify(cats));render()}
function renderExcelTheme(){const c1=document.getElementById('excelTheme');if(c1){c1.innerHTML='';themeColors.flat().forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.onclick=()=>selectColor(hex);c1.appendChild(d);});}const c2=document.getElementById('excelStandard');if(c2){c2.innerHTML='';standardColors.forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.onclick=()=>selectColor(hex);c2.appendChild(d);});}const m1=document.getElementById('modalColorsTheme');if(m1){m1.innerHTML='';themeColors.flat().forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.style.height='20px';if(cur&&cur.color===hex)d.style.outline='2px solid var(--hero)';d.onclick=()=>selectModalColor(hex);m1.appendChild(d);});}const m2=document.getElementById('modalColorsStandard');if(m2){m2.innerHTML='';standardColors.forEach(hex=>{const d=document.createElement('div');d.className='excel-cell';d.style.background=hex;d.style.height='20px';if(cur&&cur.color===hex)d.style.outline='2px solid var(--hero)';d.onclick=()=>selectModalColor(hex);m2.appendChild(d);});}}
function renderManagerLists(){document.getElementById('cat').innerHTML=cats.map(c=>`<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('');document.getElementById('catList').innerHTML=cats.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);padding:7px 9px;border-radius:8px;margin-bottom:5px;border:1px solid var(--card-border)"><div style="color:var(--text);font-size:10.3px">${c.emoji} <b>${c.name}</b></div><button onclick="delCat(${c.id})" style="border:none;background:#FEE2E2;width:25px;height:25px;border-radius:6px;color:#ef4444">✕</button></div>`).join('');renderQuickColors();renderExcelTheme();if(window.renderThemesList) renderThemesList();}
function renderQuickColors(){const row=document.getElementById('quickColors');const all=[...standardColors,...themeColors[0]];row.innerHTML=all.slice(0,8).map(c=>`<div onclick="selectColor('${c}')" class="color-dot ${selectedHex===c?'active':''}" style="background:${c}"></div>`).join('')}
function selectColor(hex){selectedHex=hex;renderQuickColors()}
function selectModalColor(hex){if(!cur)return;cur.color=hex;document.getElementById('modalCover').style.background=hex;document.getElementById('currentColorPreview').style.background=hex;renderExcelTheme();save()}
function toggleAllColors(){const box=document.getElementById('allColorsBox');box.style.display=box.style.display==='none'?'block':'none'}
function openManager(){document.getElementById('managerModal').style.display='flex';mTab('cats')}
function closeManager(){document.getElementById('managerModal').style.display='none'}
function mTab(t){document.getElementById('mCats').style.display=t==='cats'?'block':'none';document.getElementById('mColors').style.display=t==='colors'?'block':'none';document.getElementById('mThemes').style.display=t==='themes'?'block':'none';document.getElementById('mTabCats').style.background=t==='cats'?'var(--card)':'transparent';document.getElementById('mTabColors').style.background=t==='colors'?'var(--card)':'transparent';document.getElementById('mTabThemes').style.background=t==='themes'?'var(--card)':'transparent';}
function addCategory(){const n=document.getElementById('newCatName').value.trim(),e=document.getElementById('newCatEmoji').value.trim()||'📌';if(!n)return;cats.push({id:Date.now(),emoji:e,name:n});document.getElementById('newCatName').value='';renderManagerLists();save();}
function delCat(id){cats=cats.filter(c=>c.id!==id);renderManagerLists();save();}
function addQuick(){document.getElementById('mainInput').focus()}
function filterTasksTab(cat){activeTaskTab=cat;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));document.getElementById('tt_'+cat)?.classList.add('active');render();}
function getSecretCode(){try{const v=localStorage.getItem('__my_secret_num__');if(!v) return '279';return atob(v);}catch{return '279'}}
function doAdd(){const inp=document.getElementById('mainInput');const val=inp.value.trim();if(!val) return;const secret=getSecretCode();if(val===secret){inp.value='';boardSearch='';revealHiddenTab();return;}tasks.unshift({id:Date.now(),text:val,cat:document.getElementById('cat').value||cats[0].name,color:selectedHex||'#ffffff',done:false,drawings:[],photos:[],voices:[],note:'',subtasks:[],reminder:null});inp.value='';boardSearch='';save();}
document.getElementById('mainInput').addEventListener('input',e=>{const v=e.target.value.trim();const secret=getSecretCode();if(v===secret){revealHiddenTab();return;}boardSearch=v.toLowerCase();render();});
document.getElementById('mainInput').addEventListener('keydown',e=>{if(e.key==='Enter')doAdd()});
document.getElementById('subInput').addEventListener('keydown',e=>{if(e.key==='Enter')addSub()});
function render(){renderManagerLists();let filtered=tasks;if(activeTaskTab!=='all'){if(activeTaskTab==='done')filtered=filtered.filter(t=>t.done);else filtered=filtered.filter(t=>t.cat===activeTaskTab);}if(boardSearch)filtered=filtered.filter(t=>t.text.toLowerCase().includes(boardSearch));document.getElementById('stats').innerText=`${fmt(filtered.length)}/${fmt(tasks.length)} • ${activeTaskTab}`;const board=document.getElementById('board');if(!filtered.length){board.innerHTML=`<div style="text-align:center;padding:23px 11px;color:var(--text-soft)"><div style="font-size:28px">📭</div><div style="margin-top:7px;font-size:10.3px">مفيش مهام</div></div>`;return}board.innerHTML=filtered.map(t=>{const catObj=cats.find(c=>c.name===t.cat)||{emoji:'📌'};const total=t.subtasks?.length||0,done=t.subtasks?.filter(s=>s.done).length||0;const hasRem=t.reminder&&t.reminder.enabled? '⏰':'';return `<div onclick="openCard(${t.id})" style="background:${t.color==='white'||t.color==='#ffffff'? 'var(--card)' : t.color};border:1px solid var(--card-border);border-radius:11px;padding:8px 9px;cursor:pointer"><div style="display:flex;justify-content:space-between;gap:7px"><div style="font-size:11.5px;font-weight:700;flex:1;color:var(--text)">${hasRem} ${formatTextNumbers(t.text)} ${t.source==='gmail'?'<span style="font-size:9px">📧</span>':''}</div><div style="width:9px;height:9px;border-radius:50%;background:${t.done?'#22c55e':'var(--hero)'};flex-shrink:0;margin-top:4px"></div></div><div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap"><span style="font-size:9.2px;background:var(--card);padding:4px 7px;border-radius:99px;font-weight:700;border:1px solid var(--card-border);color:var(--text-soft)">${catObj.emoji} ${t.cat}</span>${total?`<span style="font-size:9.2px;background:var(--card);padding:4px 7px;border-radius:99px;font-weight:700;border:1px solid var(--card-border);color:var(--text-soft)">✔ ${fmt(done)}/${fmt(total)}</span>`:''}${hasRem?`<span style="font-size:9.2px;background:#DBEAFE;padding:4px 7px;border-radius:99px;font-weight:700;color:#2563EB">${t.reminder.repeat}</span>`:''}</div></div>`;}).join('');}
async function openCamera(){const box=document.getElementById('cameraBox');box.style.display='block';try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});document.getElementById('cameraVideo').srcObject=cameraStream;}catch(e){alert('الكاميرا غير مسموحة');}}
function closeCamera(){document.getElementById('cameraBox').style.display='none';if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}}
function takePhoto(){const v=document.getElementById('cameraVideo');const c=document.getElementById('cameraCanvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const d=c.toDataURL('image/jpeg',0.8);if(!cur.photos)cur.photos=[];cur.photos.unshift(d);refreshPhotos();closeCamera();save();}
function handleFile(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{if(!cur.photos)cur.photos=[];cur.photos.unshift(e.target.result);refreshPhotos();save();};r.readAsDataURL(f);}
function refreshPhotos(){const g=document.getElementById('photoGallery');if(!cur||!cur.photos){if(g) g.innerHTML='';return;}g.innerHTML=cur.photos.map((d,i)=>`<div style="position:relative;"><img src="${d}" style="width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--card-border);"><button onclick="delPhoto(${i})" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;border:none;font-size:9px">✕</button></div>`).join('');}
function delPhoto(i){cur.photos.splice(i,1);refreshPhotos();save();}
function toggleRem(){const en=document.getElementById('remEnabled').checked;document.getElementById('remBox').style.display=en?'block':'none'; if(en) updateNextPreview();}
function updateRepeatUI(){const v=document.getElementById('remRepeat').value;document.getElementById('customRepeatBox').style.display=(v.startsWith('custom')||v=='weekdays')?'block':'none';document.getElementById('customDaysUI').style.display=v=='custom_days'?'block':'none';document.getElementById('customHoursUI').style.display=v=='custom_hours'?'block':'none';document.getElementById('weekdaysUI').style.display=v=='weekdays'?'block':'none';updateNextPreview();}
function updateEndUI(){const v=document.getElementById('remEndType').value;document.getElementById('remAfterCount').style.display=v=='after'?'block':'none';document.getElementById('remEndDate').style.display=v=='onDate'?'block':'none';updateNextPreview();}
