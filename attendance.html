<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
body{background:#FBF9F6;padding:5px;padding-bottom:70px}
.en{font-family:'JetBrains Mono',monospace!important;direction:ltr!important;text-align:center}
.card{background:#fff;border:1px solid #F2EFEA;border-radius:14px;padding:7px;width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:5px 0;width:100%}
.stat{border-radius:11px;padding:6px 3px;border:1px solid transparent;text-align:center}
.stat:nth-child(1){background:#E0F2FE;border-color:#BAE6FD}
.stat:nth-child(2){background:#DCFCE7;border-color:#BBF7D0}
.stat:nth-child(3){background:#FEF9C3;border-color:#FDE68A}
.stat:nth-child(4){background:#FFEDD5;border-color:#FED7AA}
.stat:nth-child(5){background:#FCE7F3;border-color:#FBCFE8}
.stat:nth-child(6){background:#EDE9FE;border-color:#DDD6FE}
.stat small{font-size:7px;font-weight:700;opacity:.6;display:block}
.stat b,.stat input{font-size:10.5px!important;font-weight:800;margin-top:1px}
.time-box{width:100%;border:1px solid #F2EFEA;border-radius:9px;padding:5px 2px;text-align:center;font-size:10.5px;background:#FBF9F6;outline:none}
.time-box:focus{background:#fff;border-color:#111}
.table-wrap{background:#fff;border:1px solid #F2EFEA;border-radius:14px;overflow:hidden;width:100%}
.table-head{display:grid;grid-template-columns:1.2fr.8fr.8fr.6fr.7fr.35fr;background:#FAF8F5;font-size:7px;font-weight:700;padding:6px 3px;text-align:center;color:#9aa0aa;border-bottom:1px solid #F2EFEA}
.row-item{display:grid;grid-template-columns:1.2fr.8fr.8fr.6fr.7fr.35fr;gap:3px;align-items:center;padding:4px 2px;border-bottom:1px solid #FBF9F6;background:#fff}
</style></head><body>

  <div style="display:flex;gap:6px;align-items:center">
    <div style="font-size:10px;font-weight:800">⏱️ الحضور - مربوط بالجيميل ☁️</div>
    <button onclick="toggleTop()" id="toggleBtn" style="background:#F5F5F4;border:none;padding:3px 7px;border-radius:999px;font-size:7.5px;font-weight:700">▲ إخفاء</button>
  </div>
  <div style="display:flex;gap:4px;align-items:center">
    <div id="monthLabel" class="en" style="font-size:8px;background:#111;color:#fff;padding:3px 8px;border-radius:999px">8 / 2025</div>
    <button onclick="changeMonth(-1)" style="background:#fff;border:1px solid #E7E5E4;width:20px;height:20px;border-radius:6px;font-size:10px">‹</button>
    <button onclick="changeMonth(1)" style="background:#fff;border:1px solid #E7E5E4;width:20px;height:20px;border-radius:6px;font-size:10px">›</button>
    <div id="clock" class="en" style="font-size:8px;background:#F5F5F4;padding:3px 6px;border-radius:999px">00:00:00</div>
  </div>
</div>

<div id="topInfo">
<div class="stats">
  <div class="stat"><small>سعر الساعة</small><b id="outPrice" class="en">46.15</b></div>
  <div class="stat"><small>الساعة</small><input id="v1" type="tel" inputmode="decimal" lang="en" pattern="[0-9]*" class="en" value="1200" oninput="calcTotals(); saveSettings();"></div>
  <div class="stat"><small>كم يوم</small><input id="v2" type="tel" inputmode="decimal" lang="en" pattern="[0-9]*" class="en" value="26" oninput="calcTotals(); saveSettings();"></div>
  <div class="stat"><small>عدد الساعات</small><b id="outTotal" class="en">0</b></div>
  <div class="stat"><small>الصافي</small><b id="outSafi" class="en">0</b></div>
  <div class="stat"><small>المطلوب</small><input id="v3" type="tel" inputmode="decimal" lang="en" pattern="[0-9]*" class="en" value="15000" oninput="calcTotals(); saveSettings();"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:5px 0">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;border-color:#111;padding:6px 8px">
    <span style="font-size:8px;opacity:.8">المطلوب يومياً</span>
    <span id="outDaily" class="en" style="font-weight:800;font-size:9px;background:rgba(255,255,255,.15);padding:2px 6px;border-radius:999px">0</span>
  </div>
  <button onclick="closeMonth()" id="closeBtn" style="background:#22c55e;color:#fff;border:none;border-radius:11px;padding:6px;font-size:9px;font-weight:800">🔒 قفل الشهر وقبضت ✅</button>
</div>
<div id="closedList" style="margin:5px 0;display:flex;gap:4px;flex-wrap:wrap"></div>
<div style="display:flex;gap:5px;margin:5px 0">
  <button onclick="addNow()" style="flex:1;background:var(--hero,#16A34A);color:#fff;border:none;border-radius:9px;padding:7px;font-size:9px;font-weight:800">⏱ تسجيل الآن</button>
  <button onclick="syncNow()" style="background:#fff;border:1px solid #E7E5E4;border-radius:9px;padding:7px 10px;font-size:8px;font-weight:700">☁️ مزامنة الجيميل</button>
</div>
</div>

<div class="table-wrap"><div class="table-head"><div>اليوم</div><div>حضور</div><div>انصراف</div><div>ساعات</div><div>صافي</div><div>إجازة</div></div><div id="days" style="max-height:55vh;overflow:auto"></div></div>

<script>
// === Gmail Drive Sync ===
function pushDrive(){
  if(window.GoogleDrive && window.GoogleDrive.push) window.GoogleDrive.push();
  if(window.OneDrive && window.OneDrive.push) window.OneDrive.push();
}
function loadFromStorage(){
  try{ data = JSON.parse(localStorage.getItem('att_fixed_final')||'{}'); }catch(e){ data={}; }
  try{ hols = JSON.parse(localStorage.getItem('att_hols_fixed')||'{}'); }catch(e){ hols={}; }
  try{ closed = JSON.parse(localStorage.getItem('att_closed')||'{}'); }catch(e){ closed={}; }
  try{
    let s=JSON.parse(localStorage.getItem('att_settings')||'{}');
    if(s.v1) document.getElementById('v1').value=s.v1;
    if(s.v2) document.getElementById('v2').value=s.v2;
    if(s.v3) document.getElementById('v3').value=s.v3;
  }catch(e){}
}
document.addEventListener('gdrive-data-updated', ()=>{ loadFromStorage(); renderAll(); });
document.addEventListener('gdrive-ready', ()=>{ loadFromStorage(); renderAll(); });
document.addEventListener('onedrive-data-updated', ()=>{ loadFromStorage(); renderAll(); });

function saveSettings(){
  localStorage.setItem('att_settings', JSON.stringify({
    v1: document.getElementById('v1').value,
    v2: document.getElementById('v2').value,
    v3: document.getElementById('v3').value
  }));
  pushDrive();
}
function syncNow(){
  loadFromStorage(); renderAll();
  if(window.GoogleDrive && window.GoogleDrive.pull) window.GoogleDrive.pull().then(()=>{ loadFromStorage(); renderAll(); });
}

let topHidden=localStorage.getItem('att_top_hidden')==='1';
let curDate=new Date();
let activeKey=localStorage.getItem('att_active_month');
if(!activeKey){ activeKey=`${curDate.getFullYear()}-${curDate.getMonth()+1}`; localStorage.setItem('att_active_month',activeKey); }
let [curY,curM]=activeKey.split('-').map(Number); curM=curM-1;

let closed=JSON.parse(localStorage.getItem('att_closed')||'{}');
let data=JSON.parse(localStorage.getItem('att_fixed_final')||'{}');
let hols=JSON.parse(localStorage.getItem('att_hols_fixed')||'{}');

function toggleTop(){topHidden=!topHidden;localStorage.setItem('att_top_hidden',topHidden?'1':'0');applyTop(); pushDrive();}
function applyTop(){document.getElementById('topInfo').style.display=topHidden?'none':'block';document.getElementById('toggleBtn').innerText=topHidden?'▼ إظهار':'▲ إخفاء';}
function changeMonth(d){curM+=d;if(curM<0){curM=11;curY--;}if(curM>11){curM=0;curY++;}renderAll();}

function closeMonth(){
  let key=`${curY}-${curM+1}`;
  if(closed[key]){alert('الشهر ده مقفول قبل كده');return;}
  if(!confirm(`هتقفل شهر ${curM+1}/${curY} وتسجله انك قبضت؟\nالصافي الحالي: ${document.getElementById('outSafi').innerText} ج`)) return;
  let totalH=document.getElementById('outTotal').innerText;
  let totalMoney=document.getElementById('outSafi').innerText;
  closed[key]={hours:totalH,money:totalMoney,paidAt:new Date().toLocaleDateString('ar-EG'),required:document.getElementById('v3').value};
  localStorage.setItem('att_closed',JSON.stringify(closed));
  curM++; if(curM>11){curM=0;curY++;}
  activeKey=`${curY}-${curM+1}`;
  localStorage.setItem('att_active_month',activeKey);
  pushDrive();
  alert(`تم قفل ${key} ✅\nفتحنا لك شهر ${curM+1}/${curY} الجديد - محفوظ في الجيميل ☁️`);
  renderAll();
}

function renderClosedList(){
  let html='';Object.keys(closed).forEach(k=>{
    html+=`<span style="font-size:7px;background:#DCFCE7;border:1px solid #BBF7D0;padding:3px 6px;border-radius:999px">🔒 ${k} - ${closed[k].money}ج - قبضت ${closed[k].paidAt}</span>`;
  });
  document.getElementById('closedList').innerHTML=html;
  let curKey=`${curY}-${curM+1}`;
  document.getElementById('closeBtn').style.display=closed[curKey]?'none':'block';
}

function toEn(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9.:]/g,'');}
function parseHour(v){if(!v) return 0;v=toEn(v);if(v.includes(':')){let p=v.split(':');return (parseFloat(p[0])||0)+(parseFloat(p[1])||0)/60;}return parseFloat(v)||0;}
function calcDiff(a,b){if(!a||!b) return 0;let s=parseHour(a),e=parseHour(b);if(e<s) e+=12;let d=e-s;if(d<0) d+=24;if(d>12) d-=12;return d>0?d:0;}
function renderAll(){
  loadFromStorage();
  const list=document.getElementById('days');
  document.getElementById('monthLabel').innerText=`${curM+1} / ${curY} ${activeKey===`${curY}-${curM+1}`?'• نشط':''}`;
  const y=curY,m=curM;const now=new Date();const isThisMonth=y===now.getFullYear()&&m===now.getMonth();
  const dim=new Date(y,m+1,0).getDate();const today=isThisMonth?now.getDate():-1;
  let html='';
  for(let i=1;i<=dim;i++){
    const dt=new Date(y,m,i);const key=`${y}-${m+1}-${i}`;
    const rec=data[key]||{in:'',out:''};const isHol=hols[key];
    const hours=calcDiff(rec.in,rec.out);
    const price=(parseFloat(toEn(document.getElementById('v1').value))||0)/(parseFloat(toEn(document.getElementById('v2').value))||1);
    const safi=hours*price;
    const dayAr=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][dt.getDay()];
    const bg=isHol?'#F3F4F6':i===today?'#FFFBEB':i%2===0?'#FAF8F5':'#fff';
    const isClosed=!!closed[`${y}-${m+1}`];
    html+=`<div class="row-item" style="background:${bg};${isHol?'opacity:.5':''}${isClosed?'opacity:.6':''}">
      <div style="font-size:8px;padding-right:2px">${dayAr} <span class="en" style="font-size:6.5px;color:#9aa0aa">(${i}/${m+1})</span></div>
      <input id="in-${key}" type="tel" inputmode="decimal" lang="en" pattern="[0-9.:]*" class="time-box en" value="${rec.in}" placeholder="7" ${isHol||isClosed?'disabled':''} oninput="saveD('${key}','in',this.value)">
      <input id="out-${key}" type="tel" inputmode="decimal" lang="en" pattern="[0-9.:]*" class="time-box en" value="${rec.out}" placeholder="19" ${isHol||isClosed?'disabled':''} oninput="saveD('${key}','out',this.value)">
      <div id="h-${key}" class="en" style="font-size:8.5px;font-weight:700;color:${hours?'#111':'#cbd5e1'}">${isHol?'-':hours?hours.toFixed(2):'-'}</div>
      <div id="s-${key}" class="en" style="font-size:8.5px;font-weight:800;color:${safi?'#059669':'#cbd5e1'}">${isHol?'-':safi?Math.round(safi):'-'}</div>
      <button onclick="toggleHol('${key}')" ${isClosed?'disabled':''} style="border:none;background:${isHol?'#22c55e':'#E7E5E4'};width:18px;height:18px;border-radius:5px;font-size:8px;color:${isHol?'#fff':'#6b7280'}">${isHol?'✓':'○'}</button>
    </div>`;
  }
  list.innerHTML=html;calcTotals();renderClosedList();
}
function saveD(k,t,v){
  let clean=toEn(v);
  if(!data[k]) data[k]={in:'',out:''};
  data[k][t]=clean;
  localStorage.setItem('att_fixed_final',JSON.stringify(data));
  // حفظ في attendance_log القديم كمان للرئيسية
  let parts=k.split('-'); let d=new Date(parts[0], parts[1]-1, parts[2]);
  let logKey=d.toISOString().split('T')[0];
  let lg=JSON.parse(localStorage.getItem('attendance_log')||'[]');
  let rec=lg.find(x=>x.date===logKey);
  if(t==='in'){ if(!rec){ rec={date:logKey,in:clean,out:null}; lg.push(rec);} else rec.in=clean; }
  else { if(rec) rec.out=clean; }
  localStorage.setItem('attendance_log', JSON.stringify(lg));
  pushDrive();
  calcTotals();
}
function toggleHol(k){if(hols[k]) delete hols[k]; else hols[k]=true;localStorage.setItem('att_hols_fixed',JSON.stringify(hols)); pushDrive(); renderAll();}
function calcTotals(){
  let v1=parseFloat(toEn(document.getElementById('v1').value))||0;let v2=parseFloat(toEn(document.getElementById('v2').value))||1;let total=0;
  Object.entries(data).forEach(([k,r])=>{let [yy,mm]=k.split('-').map(Number);if(yy===curY&&mm===curM+1&&!hols[k]) total+=calcDiff(r.in,r.out);});
  const price=v2?v1/v2:0;const v3=parseFloat(toEn(document.getElementById('v3').value))||0;
  document.getElementById('outPrice').innerText=price.toFixed(2);
  document.getElementById('outTotal').innerText=total.toFixed(2);
  document.getElementById('outSafi').innerText=Math.round(total*price).toString();
  document.getElementById('outDaily').innerText=price&&v2?(v3/price/v2).toFixed(2):'0.00';
}
function addNow(){
  const n=new Date();const k=`${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()}`;const t=(n.getHours()+n.getMinutes()/60).toFixed(2);
  if(!data[k]) data[k]={in:'',out:''};
  if(!data[k].in) data[k].in=t;else data[k].out=t;
  localStorage.setItem('att_fixed_final',JSON.stringify(data));
  let [ay,am]=activeKey.split('-').map(Number);curY=ay;curM=am-1;
  pushDrive();
  renderAll();
}
setInterval(()=>{const el=document.getElementById('clock');if(el) el.innerText=new Date().toLocaleTimeString('en-GB',{hour12:false});},1000);
applyTop();loadFromStorage();renderAll();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
