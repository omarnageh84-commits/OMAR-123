*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
html,body{overflow-x:hidden;max-width:100vw;background:var(--bg,#F0FDF4);color:var(--text,#14532D);transition:.3s}
body{padding:6px;padding-bottom:80px}
.en{font-family:'JetBrains Mono',monospace!important;direction:ltr!important}
.card{background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);border-radius:13px;padding:8px;width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:6px 0}
.stat{border-radius:11px;padding:8px 3px;text-align:center;border:1.5px solid var(--card-border,#BBF7D0);background:var(--card,#fff);transition:.2s}
.stat.editable{border-color:var(--hero,#16A34A);box-shadow:0 0 0 1.5px var(--hero,#16A34A) inset;background:var(--card,#fff)}
.stat small{font-size:7px;font-weight:800;opacity:.7;display:block;margin-bottom:2px;color:var(--text-soft,#4ADE80)}
.stat b{font-size:12px!important;font-weight:900;display:block;color:var(--text,#14532D)}
.stat input{width:100%;border:none;background:transparent;text-align:center;outline:none;font-size:13px!important;font-weight:900;color:var(--text,#14532D)}
.time-box{width:100%;border:1.5px solid var(--card-border,#BBF7D0);border-radius:9px;padding:7px 2px;text-align:center;font-size:11px;background:var(--card,#fff);outline:none;font-weight:800;color:var(--text,#14532D);transition:.2s}
.time-box:focus{border-color:var(--hero,#16A34A);box-shadow:0 0 0 2px color-mix(in srgb, var(--hero,#16A34A) 20%, transparent);background:var(--card,#fff)}
.time-box.filled{background:var(--bg-soft,#DCFCE7);border-color:var(--hero,#16A34A);color:var(--text,#14532D)}
.time-box.simple{background:color-mix(in srgb, var(--hero,#16A34A) 15%, var(--card,#fff));border-color:var(--hero,#16A34A);color:var(--text,#14532D)}
.table-wrap{background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);border-radius:13px;overflow:hidden;width:100%}

let cur=new Date(),ak=localStorage.getItem('att_active_month');if(!ak){ak=`${cur.getFullYear()}-${cur.getMonth()+1}`;localStorage.setItem('att_active_month',ak)}let [cy,cmv]=ak.split('-').map(Number);cmv=cmv-1;function cm(d){cmv+=d;if(cmv<0){cmv=11;cy--}if(cmv>11){cmv=0;cy++}rn()}
function rn(){ld();let l=document.getElementById('d');document.getElementById('ml').innerText=`${cmv+1} / ${cy}`;let y=cy,m=cmv,dim=new Date(y,m+1,0).getDate(),h='';for(let i=1;i<=dim;i++){let k=`${y}-${m+1}-${i}`,rec=dt[k]||{in:'',out:''},pi=ps(rec.in),po=ps(rec.out),hr=cd(rec.in,rec.out),pr=(pm(v1.value))/(pm(v2.value)||1),sf=hr*pr,da=new Date(y,m,i),dn=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][da.getDay()],hol=hl[k];h+=`<div class="row-item" style="${hol?'opacity:.5':''}"><div style="font-size:7px;font-weight:800;color:var(--text-soft,#4ADE80)">${dn} <span class="en" style="font-size:5px">(${i}/${m+1})</span></div><input id="in-${k}" class="time-box en ${pi?(pi.sp?'simple':'filled'):''}" value="${rec.in?(pi?fd(pi):rec.in):''}" placeholder="7" inputmode="numeric" type="text" onfocus="this.select()" oninput="lc('${k}','in',this.value)" onblur="sv('${k}','in',this.value,this)"><input id="out-${k}" class="time-box en ${po?(po.sp?'simple':'filled'):''}" value="${rec.out?(po?fd(po):rec.out):''}" placeholder="19" inputmode="numeric" type="text" onfocus="this.select()" oninput="lc('${k}','out',this.value)" onblur="sv('${k}','out',this.value,this)"><div id="h-${k}" class="en" style="font-size:9px;font-weight:900;color:${hr?'var(--text,#14532D)':'var(--text-soft,#4ADE80)'};background:${hr?'var(--bg-soft,#F0FDF4)':'transparent'};padding:3px;border-radius:6px;text-align:center;border:${hr?'1px solid var(--card-border,#BBF7D0)':'none'}">${hr?hr.toFixed(2):'-'}</div><div id="s-${k}" class="en" style="font-size:9px;font-weight:900;color:${sf?'var(--hero,#16A34A)':'var(--text-soft,#4ADE80)'}">${sf?Math.round(sf).toLocaleString('en-US'):'-'}</div><button onclick="th('${k}')" style="border:1.5px solid var(--card-border,#BBF7D0);background:${hol?'var(--hero,#16A34A)':'var(--card,#fff)'};width:20px;height:20px;border-radius:6px;font-size:9px;color:${hol?'#fff':'var(--text-soft,#4ADE80)'};font-weight:900">${hol?'✓':'○'}</button></div>`}l.innerHTML=h;ct()}

</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.proto
