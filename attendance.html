<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="themes.js"></script><script src="google-drive.js"></script><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',sans-serif}
html,body{overflow-x:hidden;max-width:100vw;background:var(--bg,#F0FDF4);color:var(--text,#14532D);transition:.3s}
body{padding:6px;padding-bottom:80px}
.en{font-family:'JetBrains Mono',monospace!important;direction:ltr!important}
/* بانر الـ Drive الثابت - زي كل الشيتات */
#gdrive-status{position:sticky;top:0;z-index:100;background:#DCFCE7;color:#14532D;text-align:center;padding:6px 10px;font-size:9px;font-weight:800;border-bottom:1.5px solid #BBF7D0;margin:-6px -6px 6px -6px;letter-spacing:.2px}
.card{background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);border-radius:13px;padding:8px;width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:6px 0}
.stat{border-radius:11px;padding:7px 3px;text-align:center;border:1.5px solid var(--card-border,#BBF7D0);background:var(--card,#fff);transition:.2s}
.stat.editable{border-color:var(--hero,#16A34A);box-shadow:0 0 0 1.5px var(--hero,#16A34A) inset;background:var(--card,#fff)}
.stat small{font-size:6.5px;font-weight:800;opacity:.7;display:block;margin-bottom:2px;color:var(--text-soft,#4ADE80)}
.stat b{font-size:10.5px!important;font-weight:900;display:block;color:var(--text,#14532D)}
.stat input{width:100%;border:none;background:transparent;text-align:center;outline:none;font-size:11px!important;font-weight:900;color:var(--text,#14532D)}
.time-box{width:100%;border:1.5px solid var(--card-border,#BBF7D0);border-radius:9px;padding:5px 2px;text-align:center;font-size:9px;background:var(--card,#fff);outline:none;font-weight:800;color:var(--text,#14532D);transition:.2s}
.time-box:focus{border-color:var(--hero,#16A34A);box-shadow:0 0 0 2px color-mix(in srgb, var(--hero,#16A34A) 20%, transparent);background:var(--card,#fff)}
.time-box.filled{background:var(--bg-soft,#DCFCE7);border-color:var(--hero,#16A34A);color:var(--text,#14532D)}
.time-box.simple{background:color-mix(in srgb, var(--hero,#16A34A) 15%, var(--card,#fff));border-color:var(--hero,#16A34A);color:var(--text,#14532D)}
.table-wrap{background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);border-radius:13px;overflow:hidden;width:100%}
.table-head{display:grid;grid-template-columns:1.1fr .9fr .9fr .6fr .6fr .35fr;background:var(--bg-soft,#F0FDF4);color:var(--text-soft,#4ADE80);font-size:6px;font-weight:800;padding:7px 3px;text-align:center;border-bottom:1.5px solid var(--card-border,#BBF7D0)}
.row-item{display:grid;grid-template-columns:1.1fr .9fr .9fr .6fr .6fr .35fr;gap:3px;align-items:center;padding:3px 3px;border-bottom:1px solid var(--bg-soft,#F0FDF4);background:var(--card,#fff);transition:.15s}
.row-item:nth-child(even){background:var(--bg-soft,#F0FDF4)}
</style></head><body>
<div id="gdrive-status">☁️ مربوط بـ Gmail Drive ✅ - الداتا في Drive</div>
<script>if(window.top!==window.self){var b=document.getElementById('gdrive-status'); if(b) b.style.display='none'; document.body.style.paddingTop='0'; }</script>
<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;position:relative;z-index:5">
  <div style="display:flex;gap:8px;align-items:center">
    <div style="font-size:10px;font-weight:900">⏱️ الحضور ☁️</div>
    <div style="font-size:6.5px;background:var(--bg-soft,#F0FDF4);border:1px solid var(--card-border,#BBF7D0);padding:2px 6px;border-radius:999px;color:var(--text-soft,#4ADE80)">مربوط ✅</div>
  </div>
  <div style="display:flex;gap:4px;align-items:center">
    <div id="ml" class="en" style="font-size:7.5px;background:var(--hero,#16A34A);color:#fff;padding:3px 7px;border-radius:999px;font-weight:800">8 / 2026</div>
    <button onclick="cm(-1)" style="background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);color:var(--text,#14532D);width:22px;height:22px;border-radius:7px;font-weight:900;font-size:10px">‹</button>
    <button onclick="cm(1)" style="background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);color:var(--text,#14532D);width:22px;height:22px;border-radius:7px;font-weight:900;font-size:10px">›</button>
  </div>
</div>

<div class="stats" style="margin-top:8px">
  <div class="stat editable"><small>✏️ كم يوم</small><input id="v2" type="text" inputmode="numeric" pattern="[0-9,]*" class="en" value="26"></div>
  <div class="stat editable"><small>✏️ الساعة</small><input id="v1" type="text" inputmode="numeric" pattern="[0-9,]*" class="en" value="1,200"></div>
  <div class="stat"><small>💰 سعر الساعة</small><b id="op" class="en">46.15</b></div>
  <div class="stat editable"><small>✏️ المطلوب</small><input id="v3" type="text" inputmode="numeric" pattern="[0-9,]*" class="en" value="15,000"></div>
  <div class="stat"><small>📊 الصافي</small><b id="os" class="en" style="color:var(--hero,#16A34A)">0</b></div>
  <div class="stat"><small>⏱️ ساعات</small><b id="ot" class="en">0.00</b></div>
</div>

<div class="table-wrap"><div class="table-head"><div>اليوم</div><div>حضور</div><div>انصراف</div><div>ساعات</div><div>صافي</div><div>إجازة</div></div><div id="d" style="max-height:65vh;overflow:auto"></div></div>

<script>
function pd(){if(window.GoogleDrive&&GoogleDrive.push)GoogleDrive.push()}
addEventListener('gdrive-data-updated',()=>{ld();rn()});addEventListener('gdrive-ready',()=>{ld();rn()});
let cl={},dt={},hl={};function ld(){try{dt=JSON.parse(localStorage.getItem('att_fixed_final')||'{}')}catch(e){dt={}}try{hl=JSON.parse(localStorage.getItem('att_hols_fixed')||'{}')}catch(e){hl={}}try{cl=JSON.parse(localStorage.getItem('att_closed')||'{}')}catch(e){cl={}}try{let s=JSON.parse(localStorage.getItem('att_settings')||'{}');if(s.v1) v1.value=fm(s.v1);if(s.v2) v2.value=fm(s.v2);if(s.v3) v3.value=fm(s.v3)}catch(e){}}
function fm(n){let c=String(n).replace(/,/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));if(!c)return'';let x=parseFloat(c);return isNaN(x)?c:x.toLocaleString('en-US')}function pm(s){let c=String(s).replace(/,/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g,'');return parseFloat(c)||0}function en(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function ps(i){if(i==null)return null;let r=String(i).trim();if(!r)return null;let s=en(r).replace(/[^\d.:]/g,'').trim();if(!s)return null;let sp=/^\d+$/.test(s),h=0,m=0;if(s.includes(':')||s.includes('.')){let se=s.includes(':')?':':'.',p=s.split(se);h=parseInt(p[0]||'0');let mp=p[1]||'';if(mp.length==0)m=0;else if(mp.length==1)m=parseInt(mp)*10;else m=parseInt(mp.slice(0,2));sp=false}else{h=parseInt(s);m=0;sp=true}if(h<0)h=0;if(h>23)h=23;if(m<0)m=0;if(m>59)m=59;return{h,m,t:h+m/60,sp,os:sp?String(parseInt(s)):null}}function fd(o){if(!o)return'';if(o.sp)return o.os;let h12=o.h%12;if(h12==0)h12=12;return h12+':'+String(o.m).padStart(2,'0')+' '+(o.h<12?'ص':'م')}function cd(a,b){let A=ps(a),B=ps(b);if(!A||!B)return 0;let d=B.t-A.t;if(d<0)d+=24;if(d>16)d-=12;return d>0?d:0}
let cur=new Date(),ak=localStorage.getItem('att_active_month');if(!ak){ak=`${cur.getFullYear()}-${cur.getMonth()+1}`;localStorage.setItem('att_active_month',ak)}let [cy,cmv]=ak.split('-').map(Number);cmv=cmv-1;function cm(d){cmv+=d;if(cmv<0){cmv=11;cy--}if(cmv>11){cmv=0;cy++}rn()}
function rn(){ld();let l=document.getElementById('d');document.getElementById('ml').innerText=`${cmv+1} / ${cy}`;let y=cy,m=cmv,dim=new Date(y,m+1,0).getDate(),h='';for(let i=1;i<=dim;i++){let k=`${y}-${m+1}-${i}`,rec=dt[k]||{in:'',out:''},pi=ps(rec.in),po=ps(rec.out),hr=cd(rec.in,rec.out),pr=(pm(v1.value))/(pm(v2.value)||1),sf=hr*pr,da=new Date(y,m,i),dn=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'][da.getDay()],hol=hl[k];h+=`<div class="row-item" style="${hol?'opacity:.5':''}"><div style="font-size:6.5px;font-weight:800;color:var(--text-soft,#4ADE80)">${dn} <span class="en" style="font-size:5px">(${i}/${m+1})</span></div><input id="in-${k}" class="time-box en ${pi?(pi.sp?'simple':'filled'):''}" value="${rec.in?(pi?fd(pi):rec.in):''}" placeholder="7" inputmode="numeric" type="text" onfocus="this.select()" oninput="lc('${k}','in',this.value)" onblur="sv('${k}','in',this.value,this)"><input id="out-${k}" class="time-box en ${po?(po.sp?'simple':'filled'):''}" value="${rec.out?(po?fd(po):rec.out):''}" placeholder="19" inputmode="numeric" type="text" onfocus="this.select()" oninput="lc('${k}','out',this.value)" onblur="sv('${k}','out',this.value,this)"><div id="h-${k}" class="en" style="font-size:8px;font-weight:900;color:${hr?'var(--text,#14532D)':'var(--text-soft,#4ADE80)'};background:${hr?'var(--bg-soft,#F0FDF4)':'transparent'};padding:3px;border-radius:6px;text-align:center;border:${hr?'1px solid var(--card-border,#BBF7D0)':'none'}">${hr?hr.toFixed(2):'-'}</div><div id="s-${k}" class="en" style="font-size:8px;font-weight:900;color:${sf?'var(--hero,#16A34A)':'var(--text-soft,#4ADE80)'}">${sf?Math.round(sf).toLocaleString('en-US'):'-'}</div><button onclick="th('${k}')" style="border:1.5px solid var(--card-border,#BBF7D0);background:${hol?'var(--hero,#16A34A)':'var(--card,#fff)'};width:18px;height:18px;border-radius:6px;font-size:8px;color:${hol?'#fff':'var(--text-soft,#4ADE80)'};font-weight:900">${hol?'✓':'○'}</button></div>`}l.innerHTML=h;ct()}
function lc(k,t,v){let td={...dt};if(!td[k])td[k]={in:'',out:''};let p=ps(v),s='';if(v.trim()!=''){if(!p)s=v;else if(p.sp)s=p.os;else s=String(p.h).padStart(2,'0')+':'+String(p.m).padStart(2,'0')}td[k][t]=s;let hr=cd(td[k].in,td[k].out),pr=(pm(v1.value))/(pm(v2.value)||1),sf=hr*pr,he=document.getElementById('h-'+k),se=document.getElementById('s-'+k);if(he){he.innerText=hr?hr.toFixed(2):'-'}if(se){se.innerText=sf?Math.round(sf).toLocaleString('en-US'):'-'}let tot=0;Object.entries(td).forEach(([kk,r])=>{let [yy,mm]=kk.split('-').map(Number);if(yy==cy&&mm==cmv+1&&!hl[kk])tot+=cd(r.in,r.out)});ot.innerText=tot.toFixed(2);os.innerText=Math.round(tot*pr).toLocaleString('en-US')}
function sv(k,t,v,el){let r=v.trim();if(r==''){if(!dt[k])dt[k]={in:'',out:''};dt[k][t]='';localStorage.setItem('att_fixed_final',JSON.stringify(dt));pd();rn();return}let p=ps(r),s='';if(!p)s=en(r);else if(p.sp)s=p.os;else s=String(p.h).padStart(2,'0')+':'+String(p.m).padStart(2,'0');if(!dt[k])dt[k]={in:'',out:''};dt[k][t]=s;localStorage.setItem('att_fixed_final',JSON.stringify(dt));try{let d=new Date(k.split('-')[0],k.split('-')[1]-1,k.split('-')[2]),lk=d.toISOString().split('T')[0],lg=JSON.parse(localStorage.getItem('attendance_log')||'[]'),rc=lg.find(x=>x.date==lk);if(t=='in'){if(!rc){rc={date:lk,in:s,out:null};lg.push(rc)}else rc.in=s}else{if(rc)rc.out=s}localStorage.setItem('attendance_log',JSON.stringify(lg))}catch(e){}pd();if(el&&p){if(p.sp){el.value=p.os;el.className='time-box en simple'}else{el.value=fd(p);el.className='time-box en filled'}}ct()}
function th(k){if(hl[k])delete hl[k];else hl[k]=true;localStorage.setItem('att_hols_fixed',JSON.stringify(hl));pd();rn()}function ct(){let v1n=pm(v1.value),v2n=pm(v2.value)||1,tot=0;Object.entries(dt).forEach(([k,r])=>{let [yy,mm]=k.split('-').map(Number);if(yy==cy&&mm==cmv+1&&!hl[k])tot+=cd(r.in,r.out)});let pr=v2n?v1n/v2n:0;op.innerText=pr?pr.toFixed(2):'0';ot.innerText=tot.toFixed(2);os.innerText=Math.round(tot*pr).toLocaleString('en-US')}
;['v1','v2','v3'].forEach(id=>{let e=document.getElementById(id);e.addEventListener('input',ct);e.addEventListener('blur',function(){let c=pm(this.value);if(c)this.value=fm(c);localStorage.setItem('att_settings',JSON.stringify({v1:v1.value,v2:v2.value,v3:v3.value}));pd();ct()});e.addEventListener('focus',function(){this.value=String(pm(this.value)||'');this.select()})});ld();rn();['v1','v2','v3'].forEach(id=>{let e=document.getElementById(id);e.value=fm(pm(e.value))});ct();
</script></body></html>
