<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home - Omar</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<script src="themes.js"></script>
<script src="google-drive.js"></script>
<style>
:root{--bg:#f0f7ff;--card:#fff;--border:#dbeafe;--text:#1e3a8a;--hero:#2563eb;--text-soft:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:var(--bg);padding:10px;padding-bottom:90px;transition:background .3s}
.top-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.color-row{display:flex;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:8px;margin-bottom:10px;justify-content:center}
.cdot{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #e2e8f0;cursor:pointer;transition:.2s}
.cdot.active{box-shadow:0 0 0 2.5px var(--hero);transform:scale(1.15)}
.blue-card{background:linear-gradient(135deg,var(--hero), #1d4ed8);color:#fff;border-radius:16px;padding:14px;margin-bottom:10px;transition:.3s}
.blue-card h2{font-size:16px;font-weight:900;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.card .v{font-size:18px;font-weight:900;color:var(--text)}
.card .l{font-size:9px;color:#64748b;font-weight:700}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.act span{font-size:20px;display:block}
.act label{font-size:9px;font-weight:800;display:block;margin-top:4px}
</style>
</head>
<body>
<div id="gdrive-status" style="background:#DCFCE7;color:#14532D;text-align:center;padding:6px;border-radius:8px;font-size:9px;font-weight:800;margin-bottom:8px">☁️ مربوط بـ Gmail Drive ✅ - الداتا في Drive</div>
<script>if(window.top!==window.self){var b=document.getElementById('gdrive-status'); if(b) b.style.display='none'; }</script>

<div class="top-card"><span style="font-weight:900">⚙️</span><span style="font-weight:900">أهلاً يا عمر ✨</span><span id="themeLabel" style="font-size:9px;background:var(--bg);padding:4px 8px;border-radius:20px;color:var(--text)">أزرق</span></div>

<div class="color-row" id="colorRow">
  <div class="cdot" data-id="orange" style="background:#f59e0b" onclick="changeTheme('orange',this)"></div>
  <div class="cdot active" data-id="blue" style="background:#2563eb" onclick="changeTheme('blue',this)"></div>
  <div class="cdot" data-id="green" style="background:#16a34a" onclick="changeTheme('green',this)"></div>
  <div class="cdot" data-id="purple" style="background:#9333ea" onclick="changeTheme('purple',this)"></div>
  <div class="cdot" data-id="red" style="background:#e11d48" onclick="changeTheme('red',this)"></div>
  <div class="cdot" data-id="dark" style="background:#0f172a" onclick="changeTheme('dark',this)"></div>
</div>

<div class="blue-card">
  <div style="font-size:9px;opacity:.8">وردية اليوم • الحضور</div>
  <h2>لم يبدأ بعد</h2>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button onclick="doCheck('in')" style="flex:1;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:10px;font-family:'Tajawal';font-weight:900;cursor:pointer">👆 حضور</button>
    <button onclick="doCheck('out')" style="flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:10px;font-family:'Tajawal';font-weight:700;cursor:pointer">✓ انصراف</button>
  </div>
</div>

<div class="grid">
  <div class="card"><div class="l">💰 الرصيد الحالي</div><div class="v" id="balNow">0</div><div class="l">اضغط للتفاصيل →</div></div>
  <div class="card"><div class="l">📊 إجمالي الشهر</div><div class="v" id="monthTotal">0</div><div class="l">0 عملية</div></div>
  <div class="card"><div class="l">💸 مصروف الشهر</div><div class="v" id="expMonth">0</div><div class="l">منذ ق</div></div>
  <div class="card"><div class="l">💳 الديون</div><div class="v" id="debts">0</div><div class="l">حالة متأخرة</div></div>
  <div class="card"><div class="l">🔐 الأمانات</div><div class="v" id="aman">0</div><div class="l">كشف محاسبة</div></div>
  <div class="card"><div class="l">⭐ التقييم</div><div class="v">0</div><div class="l">كشف محاسبة</div></div>
</div>

<div style="background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px">
  <div style="font-size:11px;font-weight:900;margin-bottom:8px">دخول سريع</div>
  <div class="actions">
    <div class="act" onclick="parent.switchPage('daily.html', parent.document.querySelectorAll('.nav button')[1])"><span>💸</span><label>مصروف</label></div>
    <div class="act" onclick="parent.switchPage('daily.html', parent.document.querySelectorAll('.nav button')[1])"><span>💵</span><label>دخل</label></div>
    <div class="act" onclick="parent.switchPage('tasks.html', parent.document.querySelectorAll('.nav button')[3])"><span>✓</span><label>مهمة</label></div>
    <div class="act" onclick="parent.switchPage('attendance.html', parent.document.querySelectorAll('.nav button')[2])"><span>⏱️</span><label>حضور</label></div>
  </div>
</div>

<script>
function changeTheme(id, el){
  applyTheme(id);
  document.querySelectorAll('.cdot').forEach(c=>c.classList.remove('active'));
  if(el) el.classList.add('active');
  const names = {orange:'برتقالي', blue:'أزرق', green:'أخضر', purple:'بنفسجي', red:'أحمر', dark:'ليلي', amber:'عنبر', pharmacy:'صيدلية', forest:'غابة', rose:'وردي'};
  document.getElementById('themeLabel').innerText = names[id]||id;
  // Sync to parent
  if(window.parent && window.parent.updateThemeStatus) window.parent.updateThemeStatus();
}
function R(){
  try{
    const tx=JSON.parse(localStorage.getItem('omar_tx_v3')||'[]');
    const bal=tx.filter(t=>t.type!=='amanat'&&t.affect!==false).reduce((a,b)=>{let v=Number(b.amount)||0; if(b.type==='expense') v=-v; if(b.type==='debt') v=b.direction==='عليا'?-v:v; return a+v;},0);
    document.getElementById('balNow').textContent=bal.toLocaleString();
  }catch(e){}
  // Update active dot from saved theme
  const saved = localStorage.getItem('selectedTheme')||localStorage.getItem('theme')||'blue';
  document.querySelectorAll('.cdot').forEach(c=>{
    c.classList.toggle('active', c.dataset.id===saved);
  });
  const names = {orange:'برتقالي', blue:'أزرق', green:'أخضر', purple:'بنفسجي', red:'أحمر', dark:'ليلي', amber:'عنبر', pharmacy:'صيدلية', forest:'غابة', rose:'وردي'};
  const lbl=document.getElementById('themeLabel');
  if(lbl) lbl.innerText = names[saved]||saved;
}
function doCheck(type){ alert(type==='in'?'تم تسجيل الحضور ✅':'تم تسجيل الانصراف ✅'); }
R();
document.addEventListener('gdrive-data-updated', R);
document.addEventListener('gdrive-ready', R);
window.addEventListener('storage', R);
setInterval(R, 2000);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
