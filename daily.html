<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>اليومية - مربوطة بالجيميل</title>
<script src="themes.js"></script>
<script src="google-drive.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
html,body{overflow-x:hidden;max-width:100vw;background:var(--bg,#F0FDF4);color:var(--text,#14532D);transition:.3s}
body{padding-bottom:110px}
.app{max-width:780px;margin:0 auto;padding:8px}
.top{position:sticky;top:0;z-index:20;background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);border-radius:13px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.main-tabs{display:flex;gap:4px;background:var(--card,#fff);padding:5px;border-radius:12px;border:1.5px solid var(--card-border,#BBF7D0);margin:8px 0;overflow:auto;position:sticky;top:50px;z-index:19}
.mtab{flex:1;white-space:nowrap;border:none;padding:9px 5px;border-radius:9px;font-weight:900;font-size:11px;cursor:pointer;background:transparent;color:var(--text-soft,#4ADE80);transition:.2s}
.mtab.active{background:var(--hero,#16A34A);color:#fff}
.tsec{background:var(--card,#fff);border:1.5px solid var(--card-border,#BBF7D0);border-radius:12px;overflow:hidden;margin-bottom:8px}
.thead{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft,#F0FDF4);border-bottom:1.5px solid var(--card-border,#BBF7D0);font-size:10px;font-weight:800}
.twrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:320px}
th{background:var(--bg-soft,#F0FDF4);padding:7px 3px;font-size:8.5px;color:var(--text-soft,#4ADE80);text-align:center;position:sticky;top:0}
td{padding:7px 3px;text-align:center;font-weight:800;font-size:9.3px;color:var(--text,#14532D);border-bottom:1px solid var(--bg-soft,#F0FDF4)}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--hero,#16A34A);color:#fff;border:none;font-size:32px;z-index:9999;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;pointer-events:auto}
.fab:active{transform:translateX(-50%) scale(0.95)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:10000;backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.card{background:var(--card,#fff);width:100%;border-radius:17px 17px 0 0;padding:12px;max-height:85vh;overflow-y:auto;border:1.5px solid var(--card-border,#BBF7D0)}
.card-top-tabs{display:flex;gap:3px;background:var(--bg-soft,#F0FDF4);padding:4px;border-radius:10px;margin-bottom:10px}
.card-ttab{flex:1;border:none;padding:8px 5px;border-radius:8px;font-weight:900;font-size:9.3px;cursor:pointer;background:transparent;color:var(--text-soft,#4ADE80)}
.card-ttab.active{background:var(--hero,#16A34A);color:#fff}
.group{background:var(--bg-soft,#F0FDF4);border:1px solid var(--card-border,#BBF7D0);border-radius:9px;padding:6px 8px;margin:5px 0;display:flex;gap:6px;align-items:center}
.group label{font-size:8.5px;font-weight:800;color:var(--text-soft,#4ADE80);min-width:32px}
.group input,.group select{flex:1;padding:8px 6px;border:1px solid var(--card-border,#BBF7D0);border-radius:7px;font-weight:700;font-size:11px;background:var(--card,#fff);color:var(--text,#14532D)}
.empty{text-align:center;padding:30px 10px;color:var(--text-soft,#4ADE80);font-size:11px}
</style>
</head>
<body>
<div class="app">
<div class="top"><h3 style="font-weight:900;font-size:11px">اليومية ☁️ مربوطة بالجيميل</h3><div id="today" style="font-size:8.5px;background:var(--hero,#16A34A);color:#fff;padding:4px 8px;border-radius:20px"></div></div>
<div class="main-tabs">
<button class="mtab active" data-t="expense" onclick="switchTab('expense')">مصروف</button>
<button class="mtab" data-t="income" onclick="switchTab('income')">دخل</button>
<button class="mtab" data-t="debt" onclick="switchTab('debt')">ديون</button>
<button class="mtab" data-t="amanat" onclick="switchTab('amanat')">أمانات</button>
<button class="mtab" data-t="total" onclick="switchTab('total')">الإجمالي</button>
</div>
<div id="p-expense"><div id="t-expense"></div></div>
<div id="p-income" style="display:none"><div id="t-income"></div></div>
<div id="p-debt" style="display:none"><div style="display:flex;gap:4px;background:var(--card,#fff);padding:4px;border-radius:10px;margin:6px 0;border:1.5px solid var(--card-border,#BBF7D0)"><button id="sdue" style="flex:1;border:none;padding:7px;border-radius:7px;font-weight:900;font-size:9.3px;background:var(--hero,#16A34A);color:#fff" onclick="setDebtSub('due')">مستحق</button><button id="sdef" style="flex:1;border:none;padding:7px;border-radius:7px;font-weight:900;font-size:9.3px;background:transparent;color:var(--text-soft,#4ADE80)" onclick="setDebtSub('def')">مؤجل</button></div><div id="debt-due"></div><div id="debt-def" style="display:none"></div></div>
<div id="p-amanat" style="display:none"><div id="t-amanat"></div></div>
<div id="p-total" style="display:none"><div id="t-total"></div></div>
</div>

<button class="fab" id="fabBtn" type="button" onclick="openAdd()">+</button>

<div class="modal" id="addModal" onclick="if(event.target==this)closeAdd()"><div class="card">
<div class="card-top-tabs">
<button class="card-ttab active" id="ct-expense" onclick="switchCardTab('expense')">مصروف</button>
<button class="card-ttab" id="ct-income" onclick="switchCardTab('income')">دخل</button>
<button class="card-ttab" id="ct-debt" onclick="switchCardTab('debt')">ديون</button>
<button class="card-ttab" id="ct-amanat" onclick="switchCardTab('amanat')">أمانات</button>
</div>
<div id="form-expense">
<div class="group" style="background:var(--hero,#16A34A);border-color:var(--hero,#16A34A)"><label style="color:#fff">قيمة</label><input id="a-amount" type="number" placeholder="0"></div>
<div class="group"><label>محفظة</label><select id="a-wallet"></select></div>
<div class="group"><label>بند</label><select id="a-item"></select></div>
<div class="group"><label>تاريخ</label><input id="a-date" type="date"></div>
</div>
<div id="form-debt" style="display:none">
<div class="group" style="background:var(--hero,#16A34A);border-color:var(--hero,#16A34A)"><label style="color:#fff">قيمة</label><input id="a-amount-debt" type="number" placeholder="0"></div>
<div class="group"><label>شخص</label><input id="a-person-debt" placeholder="اسم الشخص"></div>
<div class="group"><label>نوع</label><select id="a-status"><option value="due">مستحق</option><option value="def">مؤجل</option></select><select id="a-direction"><option value="عليا">عليا</option><option value="ليا">ليا</option></select></div>
</div>
<div id="form-amanat" style="display:none">
<div class="group" style="background:var(--hero,#16A34A);border-color:var(--hero,#16A34A)"><label style="color:#fff">قيمة</label><input id="a-amount-ama" type="number" placeholder="0"></div>
<div class="group"><label>شخص</label><input id="a-person-ama" placeholder="اسم الشخص"></div>
</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button onclick="closeAdd()" style="flex:1;padding:10px;background:var(--bg-soft,#F0FDF4);border:1.5px solid var(--card-border,#BBF7D0);border-radius:10px;font-weight:800;font-size:10px">إلغاء</button>
<button onclick="saveTx()" style="flex:1;padding:10px;background:var(--hero,#16A34A);color:#fff;border:none;border-radius:10px;font-weight:900;font-size:10px">حفظ في الجيميل ☁️</button>
</div>
</div></div>

<script>
// === Google Drive Only - مفيش Firebase نهائي ===
let transactions = [];
let masterBands = [];
let wallets = [];
try{ transactions = JSON.parse(localStorage.getItem('omar_tx_v3')||'[]'); }catch(e){ transactions=[]; }
try{ masterBands = JSON.parse(localStorage.getItem('omar_master_bands')||'[]'); }catch(e){ masterBands=[]; }
try{ wallets = JSON.parse(localStorage.getItem('omar_wallets_v3')||'["كاش","محفظة بنكية","فودافون كاش","الخزنة","الأمانات"]'); }catch(e){ wallets=["كاش","محفظة بنكية","فودافون كاش","الخزنة","الأمانات"]; }
if(!Array.isArray(wallets) || wallets.length===0) wallets=["كاش","محفظة بنكية","فودافون كاش","الخزنة","الأمانات"];

let curTab='expense',curDebtSub='due',editingId=null,cardTab='expense';

function persist(){
  localStorage.setItem('omar_tx_v3', JSON.stringify(transactions));
  localStorage.setItem('omar_master_bands', JSON.stringify(masterBands));
  localStorage.setItem('omar_wallets_v3', JSON.stringify(wallets));
  if(window.GoogleDrive && window.GoogleDrive.push) window.GoogleDrive.push();
  if(window.OneDrive && window.OneDrive.push) window.OneDrive.push();
}

document.addEventListener('gdrive-data-updated', ()=>{ try{ transactions = JSON.parse(localStorage.getItem('omar_tx_v3')||'[]'); }catch(e){} renderAll(); });
document.addEventListener('gdrive-ready', ()=>{ try{ transactions = JSON.parse(localStorage.getItem('omar_tx_v3')||'[]'); }catch(e){} renderAll(); });
document.addEventListener('onedrive-data-updated', ()=>{ try{ transactions = JSON.parse(localStorage.getItem('omar_tx_v3')||'[]'); }catch(e){} renderAll(); });

function ensureMaster(){
  if(masterBands.length===0){
    masterBands=[
      {id:1,name:'الإيجار',section:'expense'},
      {id:2,name:'مبيعات',section:'income'},
      {id:3,name:'مرتبات',section:'expense'},
      {id:4,name:'الكهرباء',section:'expense'},
      {id:5,name:'الإنترنت',section:'expense'}
    ];
    localStorage.setItem('omar_master_bands', JSON.stringify(masterBands));
  }
}
function getBands(sec){return masterBands.filter(b=>b.section===sec).map(b=>b.name);}

window.switchTab=function(t){
  curTab=t;
  document.querySelectorAll('[id^="p-"]').forEach(e=>e.style.display='none');
  document.getElementById('p-'+t).style.display='block';
  document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.mtab[data-t="${t}"]`).classList.add('active');
  renderAll();
}

window.setDebtSub=function(s){
  curDebtSub=s;
  document.getElementById('debt-due').style.display=s==='due'?'block':'none';
  document.getElementById('debt-def').style.display=s==='def'?'block':'none';
  document.getElementById('sdue').style.background=s==='due'?'var(--hero,#16A34A)':'transparent';
  document.getElementById('sdue').style.color=s==='due'?'#fff':'var(--text-soft,#4ADE80)';
  document.getElementById('sdef').style.background=s==='def'?'var(--hero,#16A34A)':'transparent';
  document.getElementById('sdef').style.color=s==='def'?'#fff':'var(--text-soft,#4ADE80)';
}

window.switchCardTab=function(t){
  cardTab=t;
  document.querySelectorAll('.card-ttab').forEach(b=>b.classList.remove('active'));
  let el=document.getElementById('ct-'+t);
  if(el) el.classList.add('active');
  document.getElementById('form-expense').style.display=(t==='expense'||t==='income')?'block':'none';
  document.getElementById('form-debt').style.display=t==='debt'?'block':'none';
  document.getElementById('form-amanat').style.display=t==='amanat'?'block':'none';
  if(t==='expense' || t==='income'){
    let bands=getBands(t);
    document.getElementById('a-item').innerHTML=(bands.length?bands.map(b=>`<option>${b}</option>`).join(''):'<option>عام</option>');
  }
}

function renderSimple(type){
  let list=transactions.filter(t=>t.type===type);
  let containerId=type==='expense'?'t-expense':type==='income'?'t-income':'t-amanat';
  let el=document.getElementById(containerId);
  if(!el) return;
  if(list.length===0){
    el.innerHTML=`<div class="empty">لا يوجد ${type==='expense'?'مصروف':type==='income'?'دخل':'أمانات'} بعد<br><br>دوس + عشان تضيف</div>`;
    return;
  }
  let total=list.reduce((a,b)=>a+Number(b.amount||0),0);
  let html=`<div class="tsec"><div class="thead"><b>${type==='expense'?'مصروف':type==='income'?'دخل':'أمانات'} - ${list.length} حركة</b><span style="background:var(--hero,#16A34A);color:#fff;padding:4px 9px;border-radius:20px;font-size:9px">${total.toLocaleString()}</span></div><div class="twrap"><table><thead><tr><th>تاريخ</th><th>بند/شخص</th><th>قيمة</th><th>تحكم</th></tr></thead><tbody>${list.map(t=>`<tr><td>${(t.date||'').slice(5)}</td><td>${(t.item||t.person||'عام').toString().slice(0,18)}</td><td>${Number(t.amount||0).toLocaleString()}</td><td><button onclick="openEdit('${t.id}')" style="border:none;background:transparent;cursor:pointer">✏️</button> <button onclick="delTx('${t.id}')" style="border:none;background:transparent;cursor:pointer">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`;
  el.innerHTML=html;
}

function renderDebt(){
  let due=transactions.filter(t=>t.type==='debt' && (t.status==='due' || t.subType==='debt_due'));
  let def=transactions.filter(t=>t.type==='debt' && (t.status==='def' || t.subType==='debt_def'));
  function build(list){
    if(list.length===0) return '<div class="empty">لا يوجد</div>';
    const groups={}; list.forEach(t=>{const k=(t.person||t.item||'عام'); if(!groups[k]) groups[k]=[]; groups[k].push(t);});
    let h=''; Object.keys(groups).forEach(person=>{
      const items=groups[person];
      const tot=items.reduce((a,b)=>a+Number(b.amount||0),0);
      h+=`<div class="tsec"><div class="thead"><b>${person} - ${tot.toLocaleString()}</b><span>${items[0].direction||''}</span></div><div class="twrap"><table><tbody>${items.map(t=>`<tr><td>${(t.date||'').slice(5)}</td><td>${t.item||person}</td><td>${Number(t.amount||0).toLocaleString()}</td><td><button onclick="delTx('${t.id}')" style="border:none;background:transparent;cursor:pointer">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`;
    }); return h;
  }
  let d1=document.getElementById('debt-due'); if(d1) d1.innerHTML=build(due);
  let d2=document.getElementById('debt-def'); if(d2) d2.innerHTML=build(def);
}

function renderTotal(){
  let el=document.getElementById('t-total'); if(!el) return;
  if(transactions.length===0){ el.innerHTML='<div class="empty">لا يوجد حركات بعد</div>'; return; }
  let total=transactions.reduce((a,b)=>a+Number(b.amount||0),0);
  el.innerHTML=`<div class="tsec"><div class="thead"><b>الإجمالي - Gmail Drive ☁️ ${transactions.length} حركة</b><span style="background:var(--hero,#16A34A);color:#fff;padding:4px 9px;border-radius:20px">${total.toLocaleString()}</span></div><div class="twrap"><table><thead><tr><th>نوع</th><th>بند</th><th>قيمة</th><th>تاريخ</th></tr></thead><tbody>${transactions.map(t=>`<tr><td>${t.type}</td><td>${t.item||t.person}</td><td>${Number(t.amount||0).toLocaleString()}</td><td>${(t.date||'').slice(5)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

window.renderAll=function(){
  if(curTab==='total') renderTotal();
  else if(curTab==='debt') renderDebt();
  else renderSimple(curTab);
}

window.openAdd=function(){
  console.log('openAdd clicked, curTab=',curTab);
  editingId=null;
  let target=curTab==='total'?'expense':curTab;
  switchCardTab(target);
  let modal=document.getElementById('addModal');
  if(!modal){ alert('Modal not found'); return; }
  modal.classList.add('open');
  let wEl=document.getElementById('a-wallet');
  if(wEl) wEl.innerHTML=wallets.map(w=>`<option>${w}</option>`).join('');
  let bands=getBands(target);
  let iEl=document.getElementById('a-item');
  if(iEl) iEl.innerHTML=(bands.length?bands.map(b=>`<option>${b}</option>`).join(''):'<option>عام</option>');
  let dEl=document.getElementById('a-date');
  if(dEl) dEl.value=new Date().toISOString().slice(0,10);
  let a1=document.getElementById('a-amount'); if(a1) a1.value='';
  let a2=document.getElementById('a-amount-debt'); if(a2) a2.value='';
  let a3=document.getElementById('a-amount-ama'); if(a3) a3.value='';
}
window.closeAdd=function(){ let m=document.getElementById('addModal'); if(m) m.classList.remove('open'); }
window.openEdit=function(id){
  editingId=id; const t=transactions.find(x=>x.id===id); if(!t) return;
  switchCardTab(t.type); let modal=document.getElementById('addModal'); if(modal) modal.classList.add('open');
  if(t.type==='debt'){ let e=document.getElementById('a-amount-debt'); if(e) e.value=t.amount; let p=document.getElementById('a-person-debt'); if(p) p.value=t.person; let s=document.getElementById('a-status'); if(s) s.value=t.status||'due'; let d=document.getElementById('a-direction'); if(d) d.value=t.direction||'عليا'; }
  else if(t.type==='amanat'){ let e=document.getElementById('a-amount-ama'); if(e) e.value=t.amount; let p=document.getElementById('a-person-ama'); if(p) p.value=t.person; }
  else { let e=document.getElementById('a-amount'); if(e) e.value=t.amount; let it=document.getElementById('a-item'); if(it) it.value=t.item; let dt=document.getElementById('a-date'); if(dt) dt.value=t.date; }
}
window.delTx=async function(id){
  if(!confirm('متأكد تمسح الحركة؟')) return;
  transactions=transactions.filter(t=>t.id!==id);
  localStorage.setItem('omar_tx_v3', JSON.stringify(transactions));
  if(window.GoogleDrive && window.GoogleDrive.push) await window.GoogleDrive.push();
  renderAll();
}
window.saveTx=async function(){
  const isDebt=cardTab==='debt', isAma=cardTab==='amanat';
  const amountEl=document.getElementById(isDebt?'a-amount-debt':isAma?'a-amount-ama':'a-amount');
  if(!amountEl) return;
  const amount=amountEl.value;
  if(!amount){ var el=document.getElementById(isDebt?'a-amount-debt':isAma?'a-amount-ama':'a-amount'); if(el) el.focus(); return; }
  const payload={
    id:editingId||Date.now().toString(),
    type:cardTab,
    subType: cardTab==='debt'? (document.getElementById('a-status').value==='due'?'debt_due':'debt_def') : cardTab,
    item: document.getElementById('a-item')?.value||'عام',
    person: document.getElementById('a-person-debt')?.value||document.getElementById('a-person-ama')?.value||document.getElementById('a-item')?.value||'عام',
    amount:Number(amount),
    date: document.getElementById('a-date')?.value || new Date().toISOString().slice(0,10),
    wallet: document.getElementById('a-wallet')?.value||'كاش',
    direction: document.getElementById('a-direction')?.value||'عليا',
    status: document.getElementById('a-status')?.value||'due'
  };
  if(editingId){ const idx=transactions.findIndex(t=>t.id===editingId); if(idx>=0) transactions[idx]=payload; else transactions.push(payload); } else transactions.push(payload);
  localStorage.setItem('omar_tx_v3', JSON.stringify(transactions));
  if(window.GoogleDrive && window.GoogleDrive.push){ await window.GoogleDrive.push(); }
  closeAdd(); renderAll();
}

// Init
(function init(){
  const today=new Date();
  const el=document.getElementById('today');
  if(el) el.textContent=today.toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'});
  ensureMaster();
  renderAll();
  // تأكد الزرار شغال
  let fab=document.getElementById('fabBtn');
  if(fab){
    fab.addEventListener('click', function(e){ e.preventDefault(); console.log('FAB clicked'); window.openAdd(); });
  }
  console.log('Daily Gmail Drive ready, transactions=',transactions.length);
})();
</script>
